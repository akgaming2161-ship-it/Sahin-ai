<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sahin AI</title>

<style>
:root{
  --bg:#f7f7f8;
  --panel:#fff;
  --text:#171717;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#111827;
}

*{
  box-sizing:border-box;
  min-width:0;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
textarea,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  display:flex;
  width:100%;
  max-width:100%;
  height:100vh;
  min-height:0;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.side{
  width:270px;
  max-width:270px;
  flex:0 0 270px;
  background:#111827;
  color:#fff;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow:hidden;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:.2px;
  white-space:nowrap;
}

.new{
  border:1px solid #374151;
  background:#1f2937;
  color:#fff;
  padding:11px 14px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.new:hover{
  background:#374151;
}

.history{
  flex:1;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
}

.history button{
  display:block;
  width:100%;
  max-width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#d1d5db;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history button:hover{
  background:#1f2937;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1 1 auto;
  width:calc(100% - 270px);
  max-width:calc(100% - 270px);
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.top{
  height:62px;
  min-height:62px;
  flex:none;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.top strong{
  font-size:18px;
}

.icon{
  border:0;
  background:transparent;
  color:inherit;
  font-size:20px;
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  flex:none;
}

.icon:hover{
  background:#0000000a;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1 1 auto;
  width:100%;
  max-width:100%;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:30px 18px 150px;
  scroll-behavior:smooth;
}

.wrap{
  width:100%;
  max-width:850px;
  min-width:0;
  margin:0 auto;
}

.welcome{
  width:100%;
  max-width:100%;
  text-align:center;
  padding:12vh 10px;
}

.welcome h1{
  font-size:38px;
  margin:0 0 10px;
}

.welcome p{
  color:var(--muted);
  margin:0;
  overflow-wrap:anywhere;
}

.msg{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin:22px 0;
  width:100%;
  max-width:100%;
  min-width:0;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  min-height:34px;
  border-radius:9px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  flex:none;
}

.user .avatar{
  background:#e5e7eb;
  color:#111;
}

.bubble{
  width:auto;
  max-width:calc(100% - 46px);
  min-width:0;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
}

.typing{
  color:var(--muted);
  font-style:italic;
}

/* =========================
   COMPOSER
========================= */

.composer{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  width:auto;
  max-width:none;
  padding:16px;
  z-index:20;
  background:linear-gradient(
    transparent,
    var(--bg) 35%
  );
}

.box{
  width:100%;
  max-width:850px;
  min-width:0;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  box-shadow:0 4px 18px #0000000d;
  overflow:hidden;
}

.box textarea{
  flex:1 1 auto;
  width:100%;
  min-width:0;
  max-width:100%;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  font:inherit;
  min-height:44px;
  max-height:150px;
  padding:10px;
  line-height:1.4;
  overflow-y:auto;
}

.box textarea::placeholder{
  color:var(--muted);
}

.send{
  flex:0 0 44px;
  width:44px;
  height:44px;
  min-width:44px;
  min-height:44px;
  background:#111827;
  color:#fff;
  border:0;
  border-radius:11px;
  cursor:pointer;
  transition:.2s;
}

.send:hover{
  opacity:.85;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.file{
  display:none;
}

/* =========================
   SETTINGS MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.card{
  background:var(--panel);
  color:var(--text);
  width:min(440px,100%);
  max-width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
  padding:22px;
}

.card h2{
  margin-top:0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.row span{
  min-width:0;
  overflow-wrap:anywhere;
}

.close{
  float:right;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:22px;
  cursor:pointer;
}

/* =========================
   DARK MODE
========================= */

.dark{
  --bg:#0b0f14;
  --panel:#111827;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --line:#273244;
}

.dark .top{
  border-color:#273244;
}

.dark .box{
  box-shadow:none;
}

.dark .icon:hover{
  background:#ffffff0d;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .side{
    display:none;
  }

  .main{
    width:100%;
    max-width:100%;
  }

  .top{
    padding:0 12px;
  }

  .composer{
    left:0;
    right:0;
    width:100%;
    padding:10px;
    background:linear-gradient(
      transparent,
      var(--bg) 25%
    );
  }

  .chat{
    padding:20px 12px 125px;
  }

  .wrap{
    width:100%;
    max-width:100%;
  }

  .welcome{
    padding:10vh 10px;
  }

  .welcome h1{
    font-size:30px;
  }

  .msg{
    gap:8px;
    margin:18px 0;
  }

  .avatar{
    width:32px;
    height:32px;
    min-width:32px;
    min-height:32px;
  }

  .bubble{
    max-width:calc(100% - 40px);
  }

  .box{
    width:100%;
    max-width:100%;
    border-radius:14px;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:420px){

  .composer{
    padding:8px;
  }

  .box{
    gap:3px;
    padding:6px;
    border-radius:13px;
  }

  .icon{
    font-size:18px;
    padding:7px;
  }

  .send{
    flex:0 0 42px;
    width:42px;
    height:42px;
    min-width:42px;
    min-height:42px;
  }

  .box textarea{
    padding:9px 5px;
    font-size:15px;
  }

  .chat{
    padding-left:10px;
    padding-right:10px;
  }

  .msg{
    gap:7px;
  }

  .bubble{
    max-width:calc(100% - 39px);
    font-size:15px;
  }
}

/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:330px){

  .icon{
    padding:5px;
    font-size:16px;
  }

  .box textarea{
    font-size:14px;
  }

  .send{
    flex-basis:40px;
    width:40px;
    min-width:40px;
    height:40px;
    min-height:40px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="side">

    <div class="logo">
      ✦ Sahin AI
    </div>

    <button class="new" id="newChat" type="button">
      ＋ New chat
    </button>

    <div class="history" id="history"></div>

    <button class="new" id="settings" type="button">
      ⚙ Settings
    </button>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="top">

      <strong>Sahin AI</strong>

      <button
        class="icon"
        id="mobileSettings"
        title="Settings"
        aria-label="Settings"
        type="button"
      >
        ⚙
      </button>

    </header>


    <section class="chat" id="chat">

      <div class="wrap" id="wrap">

        <div class="welcome" id="welcome">

          <h1>
            How can I help?
          </h1>

          <p>
            Chat, upload a file, or use your microphone.
          </p>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- =========================
     COMPOSER
========================= -->

<div class="composer">

  <div class="box">

    <label
      class="icon"
      title="Attach file"
      aria-label="Attach file"
    >
      📎

      <input
        class="file"
        id="file"
        type="file"
        accept=".txt,.pdf,.png,.jpg,.jpeg"
      >

    </label>


    <button
      class="icon"
      id="mic"
      title="Voice input"
      aria-label="Voice input"
      type="button"
    >
      🎙️
    </button>


    <textarea
      id="input"
      placeholder="Message Sahin AI..."
      rows="1"
      autocomplete="off"
      spellcheck="true"
    ></textarea>


    <button
      class="send"
      id="send"
      title="Send"
      aria-label="Send message"
      type="button"
    >
      ➤
    </button>

  </div>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div
  class="modal"
  id="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settingsTitle"
>

  <div class="card">

    <button
      class="close"
      id="close"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <h2 id="settingsTitle">
      Settings
    </h2>


    <div class="row">

      <span>
        Dark mode
      </span>

      <button
        class="new"
        id="theme"
        type="button"
      >
        Toggle
      </button>

    </div>


    <div class="row">

      <span>
        Clear chat history
      </span>

      <button
        class="new"
        id="clear"
        type="button"
      >
        Clear
      </button>

    </div>


    <p
      style="
        color:var(--muted);
        font-size:13px;
        line-height:1.5;
      "
    >
      Sahin AI requires a secure backend/API
      for real AI responses. Never put secret
      API keys directly inside this HTML file.
    </p>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const $ = id => document.getElementById(id);

const chat = $("chat");
const wrap = $("wrap");
const input = $("input");
const send = $("send");
const historyBox = $("history");


/* =========================
   CHAT DATA
========================= */

let messages = [];

try {

  const saved =
    localStorage.getItem("sahin_history");

  const parsed =
    JSON.parse(saved || "[]");

  messages =
    Array.isArray(parsed)
      ? parsed
      : [];

} catch {

  messages = [];

}


/* =========================
   SAVE
========================= */

function save(){

  try {

    localStorage.setItem(
      "sahin_history",
      JSON.stringify(messages)
    );

  } catch(error){

    console.warn(
      "Could not save chat:",
      error
    );

  }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  role,
  text,
  store = true
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const row =
    document.createElement("div");

  row.className =
    "msg " + role;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "U"
      : "S";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    String(text ?? "");


  row.appendChild(avatar);
  row.appendChild(bubble);

  wrap.appendChild(row);


  if(store){

    messages.push({
      role:role,
      text:String(text ?? "")
    });

    save();
    updateHistory();

  }


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });


  return row;
}


/* =========================
   RENDER
========================= */

function render(){

  wrap.innerHTML = "";

  if(!messages.length){

    wrap.innerHTML = `
      <div class="welcome">
        <h1>How can I help?</h1>
        <p>
          Chat, upload a file, or use your microphone.
        </p>
      </div>
    `;

    updateHistory();

    return;
  }


  messages.forEach(message => {

    addMessage(
      message.role,
      message.text,
      false
    );

  });


  updateHistory();

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================
   HISTORY
========================= */

function updateHistory(){

  historyBox.innerHTML = "";

  if(!messages.length){
    return;
  }


  const firstUserMessage =
    messages.find(
      message =>
        message.role === "user"
    );


  if(!firstUserMessage){
    return;
  }


  const button =
    document.createElement("button");

  const title =
    firstUserMessage.text || "New chat";

  button.textContent =
    title.substring(0,35) +
    (
      title.length > 35
        ? "..."
        : ""
    );


  button.onclick = () => {

    chat.scrollTop = 0;

  };


  historyBox.appendChild(button);

}


/* =========================
   AI REQUEST
========================= */

async function reply(){

  const typing =
    addMessage(
      "assistant",
      "Sahin AI is thinking...",
      false
    );


  const bubble =
    typing.querySelector(".bubble");


  bubble.classList.add("typing");


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              messages.map(
                message => ({

                  role:
                    message.role === "assistant"
                      ? "assistant"
                      : "user",

                  content:
                    message.text

                })
              )

          })

        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server returned invalid JSON."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        `Server error: ${response.status}`
      );

    }


    /*
      Supports common backend
      response formats.
    */

    const aiText =
      data.reply ??
      data.text ??
      data.message ??
      data.content ??
      data.response ??
      data.output ??
      data.choices?.[0]?.message?.content;


    if(
      aiText === undefined ||
      aiText === null ||
      String(aiText).trim() === ""
    ){

      throw new Error(
        "The server returned no AI response."
      );

    }


    typing.remove();


    addMessage(
      "assistant",
      String(aiText)
    );


  } catch(error){

    bubble.classList.remove(
      "typing"
    );

    bubble.textContent =
      "⚠️ " +
      (
        error.message ||
        "Something went wrong."
      );

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    send.disabled
  ){

    return;

  }


  addMessage(
    "user",
    text
  );


  input.value = "";

  input.style.height = "auto";


  send.disabled = true;

  send.textContent = "⏳";


  try {

    await reply();

  } finally {

    send.disabled = false;

    send.textContent = "➤";

    input.focus();

  }

}


/* =========================
   SEND BUTTON
========================= */

send.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   AUTO RESIZE TEXTAREA
========================= */

input.addEventListener(
  "input",
  () => {

    input.style.height = "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================
   NEW CHAT
========================= */

$("newChat").onclick = () => {

  messages = [];

  save();

  render();

  input.value = "";

  input.style.height = "auto";

  input.focus();

};


/* =========================
   SETTINGS
========================= */

function openSettings(){

  $("modal").style.display =
    "flex";

}


$("settings").onclick =
  openSettings;

$("mobileSettings").onclick =
  openSettings;


/* =========================
   CLOSE SETTINGS
========================= */

$("close").onclick = () => {

  $("modal").style.display =
    "none";

};


$("modal").addEventListener(
  "click",
  event => {

    if(
      event.target === $("modal")
    ){

      $("modal").style.display =
        "none";

    }

  }
);


/* =========================
   ESC CLOSE MODAL
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      $("modal").style.display === "flex"
    ){

      $("modal").style.display =
        "none";

    }

  }
);


/* =========================
   DARK MODE
========================= */

$("theme").onclick = () => {

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "sahin_dark",
    document.body.classList.contains(
      "dark"
    )
  );

};


if(
  localStorage.getItem(
    "sahin_dark"
  ) === "true"
){

  document.body.classList.add(
    "dark"
  );

}


/* =========================
   CLEAR CHAT
========================= */

$("clear").onclick = () => {

  messages = [];

  save();

  render();

  $("modal").style.display =
    "none";

  input.value = "";

  input.style.height = "auto";

  input.focus();

};


/* =========================
   FILE SELECT
========================= */

$("file").onchange =
  event => {

    const file =
      event.target.files[0];

    if(!file){
      return;
    }


    addMessage(
      "user",
      "📎 Attached: " +
      file.name +
      "\n\nFile selected successfully."
    );


    /*
      File is currently only
      displayed in the chat.
      Real file analysis needs
      backend support.
    */

    event.target.value = "";

  };


/* =========================
   VOICE INPUT
========================= */

$("mic").onclick = () => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    navigator.language || "en-US";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart = () => {

    $("mic").textContent =
      "🔴";

  };


  recognition.onresult =
    event => {

      input.value =
        event.results[0][0].transcript;

      input.dispatchEvent(
        new Event("input")
      );

      input.focus();

    };


  recognition.onerror =
    event => {

      console.warn(
        "Speech recognition:",
        event.error
      );

  };


  recognition.onend = () => {

    $("mic").textContent =
      "🎙️";

  };


  try {

    recognition.start();

  } catch(error){

    console.warn(
      "Voice recognition:",
      error
    );

  }

};


/* =========================
   START
========================= */

render();

input.focus();

</script>

</body>
</html>
