<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahin AI</title>

<style>
:root{
  --bg:#f7f7f8;
  --panel:#fff;
  --text:#171717;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#111827;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
textarea{
  font:inherit;
}

.app{
  display:flex;
  min-height:100vh;
}

.side{
  width:270px;
  background:#111827;
  color:#fff;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.new{
  border:1px solid #374151;
  background:#1f2937;
  color:#fff;
  padding:11px 14px;
  border-radius:10px;
  cursor:pointer;
}

.new:hover{
  background:#374151;
}

.history{
  flex:1;
  overflow:auto;
}

.history button{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#d1d5db;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.history button:hover{
  background:#1f2937;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.top{
  height:62px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.top strong{
  font-size:18px;
}

.icon{
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
  padding:8px;
}

.chat{
  flex:1;
  overflow:auto;
  padding:30px 18px 140px;
}

.wrap{
  max-width:850px;
  margin:auto;
}

.welcome{
  text-align:center;
  padding:12vh 10px;
}

.welcome h1{
  font-size:38px;
  margin:0 0 10px;
}

.welcome p{
  color:var(--muted);
}

.msg{
  display:flex;
  gap:12px;
  margin:22px 0;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  flex:none;
}

.user .avatar{
  background:#e5e7eb;
  color:#111;
}

.bubble{
  max-width:78%;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.composer{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  padding:16px;
  background:linear-gradient(
    transparent,
    var(--bg) 35%
  );
}

.box{
  max-width:850px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  box-shadow:0 4px 18px #0000000d;
}

.box textarea{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  font:inherit;
  min-height:44px;
  max-height:150px;
  padding:10px;
}

.send{
  background:#111827;
  color:#fff;
  border:0;
  border-radius:11px;
  width:44px;
  height:44px;
  cursor:pointer;
}

.send:hover{
  opacity:.85;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.file{
  display:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.card{
  background:var(--panel);
  color:var(--text);
  width:min(440px,100%);
  border-radius:16px;
  padding:22px;
}

.card h2{
  margin-top:0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.close{
  float:right;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:22px;
  cursor:pointer;
}

.typing{
  color:var(--muted);
  font-style:italic;
}

.dark{
  --bg:#0b0f14;
  --panel:#111827;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --line:#273244;
}

.dark .top{
  border-color:#273244;
}

.dark .box{
  box-shadow:none;
}

@media(max-width:700px){

  .side{
    display:none;
  }

  .composer{
    left:0;
  }

  .welcome h1{
    font-size:30px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="side">

    <div class="logo">
      ✦ Sahin AI
    </div>

    <button class="new" id="newChat">
      ＋ New chat
    </button>

    <div class="history" id="history"></div>

    <button class="new" id="settings">
      ⚙ Settings
    </button>

  </aside>


  <main class="main">

    <header class="top">

      <strong>Sahin AI</strong>

      <button
        class="icon"
        id="mobileSettings"
        title="Settings"
      >
        ⚙
      </button>

    </header>


    <section class="chat" id="chat">

      <div class="wrap" id="wrap">

        <div class="welcome" id="welcome">

          <h1>
            How can I help?
          </h1>

          <p>
            Chat, upload a file, or use your microphone.
          </p>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- Composer -->

<div class="composer">

  <div class="box">

    <label
      class="icon"
      title="Attach file"
    >
      📎

      <input
        class="file"
        id="file"
        type="file"
        accept=".txt,.pdf,.png,.jpg,.jpeg"
      >

    </label>


    <button
      class="icon"
      id="mic"
      title="Voice input"
    >
      🎙️
    </button>


    <textarea
      id="input"
      placeholder="Message Sahin AI..."
      rows="1"
    ></textarea>


    <button
      class="send"
      id="send"
      title="Send"
    >
      ➤
    </button>

  </div>

</div>


<!-- Settings -->

<div
  class="modal"
  id="modal"
>

  <div class="card">

    <button
      class="close"
      id="close"
    >
      ×
    </button>

    <h2>
      Settings
    </h2>


    <div class="row">

      <span>
        Dark mode
      </span>

      <button
        class="new"
        id="theme"
      >
        Toggle
      </button>

    </div>


    <div class="row">

      <span>
        Clear chat history
      </span>

      <button
        class="new"
        id="clear"
      >
        Clear
      </button>

    </div>


    <p
      style="
        color:var(--muted);
        font-size:13px;
        line-height:1.5;
      "
    >
      Sahin AI requires a secure backend/API
      for real AI responses. Never put secret
      API keys directly inside this HTML file.
    </p>

  </div>

</div>


<script>

const $ = id => document.getElementById(id);

const chat = $("chat");
const wrap = $("wrap");
const input = $("input");
const send = $("send");
const historyBox = $("history");

let messages = [];

try {
  messages =
    JSON.parse(
      localStorage.getItem("sahin_history") || "[]"
    );
} catch {
  messages = [];
}


/* Save chat */

function save(){

  localStorage.setItem(
    "sahin_history",
    JSON.stringify(messages)
  );

}


/* Add message */

function addMessage(
  role,
  text,
  store = true
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const row =
    document.createElement("div");

  row.className =
    "msg " + role;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user" ? "U" : "S";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(avatar);
  row.appendChild(bubble);

  wrap.appendChild(row);


  if(store){

    messages.push({
      role:role,
      text:text
    });

    save();
    updateHistory();

  }


  chat.scrollTop =
    chat.scrollHeight;

  return row;
}


/* Render chat */

function render(){

  wrap.innerHTML = "";

  if(!messages.length){

    wrap.innerHTML = `
      <div class="welcome">
        <h1>How can I help?</h1>
        <p>
          Chat, upload a file, or use your microphone.
        </p>
      </div>
    `;

    updateHistory();

    return;
  }


  messages.forEach(message => {

    addMessage(
      message.role,
      message.text,
      false
    );

  });


  updateHistory();

  chat.scrollTop =
    chat.scrollHeight;
}


/* History */

function updateHistory(){

  historyBox.innerHTML = "";

  if(!messages.length){
    return;
  }


  const button =
    document.createElement("button");

  button.textContent =
    messages[0].text.substring(0,35) +
    (messages[0].text.length > 35 ? "..." : "");

  button.onclick = () => {

    chat.scrollTop = 0;

  };


  historyBox.appendChild(button);
}


/* AI request */

async function reply(userText){

  const typing =
    addMessage(
      "assistant",
      "Sahin AI is thinking...",
      false
    );

  typing
    .querySelector(".bubble")
    .classList.add("typing");


  try{

    const api =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              messages.map(m => ({

                role:
                  m.role === "assistant"
                    ? "assistant"
                    : "user",

                content:
                  m.text

              }))

          })

        }
      );


    let data = {};

    try{
      data = await api.json();
    }catch{
      data = {};
    }


    if(!api.ok){

      throw new Error(
        data.error ||
        data.message ||
        "Request failed"
      );

    }


    /* Support different backend formats */

    const aiText =
      data.reply ||
      data.text ||
      data.message ||
      data.content ||
      data.response ||
      data.output;


    if(!aiText){

      throw new Error(
        "The server returned no AI response."
      );

    }


    typing.remove();

    addMessage(
      "assistant",
      String(aiText)
    );


  }catch(error){

    typing
      .querySelector(".bubble")
      .textContent =
        "⚠️ " +
        error.message;

  }

}


/* Send */

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text) return;


  addMessage(
    "user",
    text
  );


  input.value = "";

  send.disabled = true;


  await reply(text);


  send.disabled = false;

  input.focus();

}


/* Send button */

send.onclick =
  sendMessage;


/* Enter */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* New chat */

$("newChat").onclick = () => {

  messages = [];

  save();

  render();

  input.focus();

};


/* Settings */

function openSettings(){

  $("modal").style.display =
    "flex";

}


$("settings").onclick =
  openSettings;

$("mobileSettings").onclick =
  openSettings;


/* Close */

$("close").onclick = () => {

  $("modal").style.display =
    "none";

};


$("modal").addEventListener(
  "click",
  event => {

    if(
      event.target === $("modal")
    ){

      $("modal").style.display =
        "none";

    }

  }
);


/* Dark mode */

$("theme").onclick = () => {

  document.body.classList.toggle(
    "dark"
  );

  localStorage.setItem(
    "sahin_dark",
    document.body.classList.contains("dark")
  );

};


if(
  localStorage.getItem("sahin_dark")
  === "true"
){

  document.body.classList.add("dark");

}


/* Clear */

$("clear").onclick = () => {

  messages = [];

  save();

  render();

  $("modal").style.display =
    "none";

};


/* File */

$("file").onchange =
  event => {

    const file =
      event.target.files[0];

    if(!file) return;


    addMessage(
      "user",
      "📎 Attached: " +
      file.name +
      "\n\nFile selected successfully."
    );


    event.target.value = "";

  };


/* Voice input */

$("mic").onclick = () => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onresult =
    event => {

      input.value =
        event.results[0][0].transcript;

      input.focus();

    };


  recognition.onerror =
    () => {

      alert(
        "Could not recognize your voice."
      );

    };


  recognition.start();

};


/* Start */

render();

input.focus();

</script>

</body>
</html>
